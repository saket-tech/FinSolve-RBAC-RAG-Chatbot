name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: finsolve-api
  UI_IMAGE: finsolve-ui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify required secrets
        run: |
          echo "Verifying required secrets..."
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then echo "❌ AZURE_CREDENTIALS is missing"; exit 1; fi
          if [ -z "${{ secrets.ACR_NAME }}" ]; then echo "❌ ACR_NAME is missing"; exit 1; fi
          if [ -z "${{ secrets.ACR_PASSWORD }}" ]; then echo "❌ ACR_PASSWORD is missing"; exit 1; fi
          if [ -z "${{ secrets.AZURE_RESOURCE_GROUP }}" ]; then echo "❌ AZURE_RESOURCE_GROUP is missing"; exit 1; fi
          if [ -z "${{ secrets.GROQ_API_KEY }}" ]; then echo "❌ GROQ_API_KEY is missing"; exit 1; fi
          if [ -z "${{ secrets.JWT_SECRET }}" ]; then echo "❌ JWT_SECRET is missing"; exit 1; fi
          echo "✅ All required secrets are present"
          echo "Resource Group: ${{ secrets.AZURE_RESOURCE_GROUP }}"
          echo "ACR Name: ${{ secrets.ACR_NAME }}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push API image
        run: |
          docker build -f Dockerfile.api -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:${{ github.sha }} .
          docker build -f Dockerfile.api -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:latest

      - name: Build and push Streamlit image
        run: |
          docker build -f Dockerfile.streamlit -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:${{ github.sha }} .
          docker build -f Dockerfile.streamlit -t ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:latest .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:latest

      - name: Deploy API to Container Apps
        run: |
          az containerapp create \
            --name finsolve-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --environment finsolve-env \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_NAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8000 \
            --ingress external \
            --cpu 1.0 --memory 2.0Gi \
            --min-replicas 1 --max-replicas 2 \
            --env-vars \
              GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              JWT_SECRET=${{ secrets.JWT_SECRET }} \
              GROQ_MODEL=llama-3.3-70b-versatile \
              LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }} \
              LANGSMITH_PROJECT=finsolve-chatbot \
            || az containerapp update \
            --name finsolve-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.API_IMAGE }}:${{ github.sha }} \
            --set-env-vars \
              GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
              JWT_SECRET=${{ secrets.JWT_SECRET }} \
              GROQ_MODEL=llama-3.3-70b-versatile \
              LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }} \
              LANGSMITH_PROJECT=finsolve-chatbot

      - name: Get API FQDN
        id: api_url
        run: |
          FQDN=$(az containerapp show \
            --name finsolve-api \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> $GITHUB_OUTPUT

      - name: Deploy Streamlit to Container Apps
        run: |
          az containerapp create \
            --name finsolve-ui \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --environment finsolve-env \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:${{ github.sha }} \
            --registry-server ${{ secrets.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_NAME }} \
            --registry-password ${{ secrets.ACR_PASSWORD }} \
            --target-port 8501 \
            --ingress external \
            --cpu 0.5 --memory 1.0Gi \
            --min-replicas 1 --max-replicas 2 \
            --env-vars API_URL=${{ steps.api_url.outputs.url }} \
            || az containerapp update \
            --name finsolve-ui \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.UI_IMAGE }}:${{ github.sha }} \
            --set-env-vars API_URL=${{ steps.api_url.outputs.url }}

      - name: Show deployment URLs
        run: |
          echo "✅ Deployment complete!"
          echo "API URL: ${{ steps.api_url.outputs.url }}"
          UI_FQDN=$(az containerapp show --name finsolve-ui --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "UI URL: https://$UI_FQDN"
